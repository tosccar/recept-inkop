services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: recept-inkop:latest
    container_name: recept-inkop
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: "/data"
    volumes:
      - ./data:/data
    expose:
      - "8080"
    networks:
      - web
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8080)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true
